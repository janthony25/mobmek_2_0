# $scheme here is always "http" once Caddy sits in front — the Caddy-to-nginx hop is plain
# HTTP on the Docker network even when the real client connected over HTTPS, so blindly
# forwarding $scheme would silently tell the API every request is HTTP and the auth cookie
# would never get Secure (the exact bug fixed once already, at the client-to-nginx hop — this
# is the same bug one hop further in). Pass through whatever upstream already determined
# (Caddy sets this correctly); only fall back to nginx's own $scheme when nothing sent it,
# i.e. local dev with nginx hit directly on :3000, no proxy in front at all.
map $http_x_forwarded_proto $proxy_x_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # nginx defaults to 1MB, which silently 413s any phone photo over that before it ever
    # reaches the API's own check (JobPhotosController.MaxPhotoBytes) — keep these two in sync.
    client_max_body_size 25m;

    # Forward API calls to the backend service on the compose network.
    # "api" is the docker-compose service name; 8080 is its HTTP port.
    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
    }

    # The appointments calendar's live-refresh (Server-Sent Events) endpoint. Longer, more
    # specific location wins over /api/ above for this path. nginx buffers proxied responses
    # by default, which would hold every event back until the connection closed — the exact
    # opposite of what a push endpoint is for. proxy_read_timeout is raised because this
    # connection is meant to sit open indefinitely, not the usual request/response lifetime
    # (the endpoint sends its own ~20s heartbeat comment to keep it alive regardless).
    location /api/appointments/stream {
        proxy_pass http://api:8080/api/appointments/stream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # SPA fallback: serve index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
